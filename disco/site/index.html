<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">   <!-- YouTube embeds refuse to play without a referrer -->
<title>The Rock Garden — Disco</title>
<style>
:root{--pink:#ff3fa4;--cyan:#29e6ff;--amber:#ffb02e;--ink:#f4ead8}
*{box-sizing:border-box}
/* the colour lives on <html> only: a <body> background would paint OVER the video layer that sits behind the canvas in disco mode */
html{background:#B7BD9F}
body{background:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;color:var(--ink);font-family:ui-monospace,monospace;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:#A2AC8B}
#bg .tile,#bg .fill{position:absolute;transform-origin:50% 50%}
#bg .tile{background-size:100% 100%;background-repeat:no-repeat}
#birds{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
#shadow{position:fixed;left:0;top:0;z-index:-2;pointer-events:none;border-radius:50%;opacity:0;will-change:transform,opacity;background:radial-gradient(closest-side,rgba(38,32,22,.55),rgba(38,32,22,.30) 50%,rgba(38,32,22,0))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.grabbing{cursor:grabbing}
#yt-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.yt-frame{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;opacity:0;background:#000;pointer-events:none;will-change:transform,opacity}
.yt-frame iframe{display:block;width:960px;height:540px;border:0}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="birds"></canvas>
<div id="shadow"></div>
<canvas id="c"></canvas>
<div id="yt-layer"></div>
<script>
/* Per-station settings. Everything the page needs to know about *which* station it is lives here,
   so the Bridge City / Golden Boombox versions are a copy of this file with different values. */
window.DISCO_CONFIG = {
  station: 'the-rock-garden',
  logo: 'trg-logo-black.png',      // etched into the four slabs; used exactly as supplied
  // The room is a picture. Positions are fractions of the picture, MEASURED from the file (not eyeballed): the soft halo the ball
  // hovers in, the pale floor pool its shadow lands on, and which band of the picture must stay on screen on wide screens.
  stage: {
    image: 'bg-stage.webp', w: 1184, h: 2096,
    halo: 0.390,                       // vertical centre of the sky glow the ball floats in (measured)
    ovalX: 0.51, ovalY: 0.708, ovalW: 0.42,   // the lake's pale floor pool: centre and width (measured)
    startZoom: 0.25,   // where the page starts: this fraction of the way from the picture's design size to 'the ball's sides touch the screen's sides' (0 = design size)
    lower: 0.30,                        // fraction of the ball-to-pool gap removed (ball hovers lower; 0 = original height)
    shadow: 0.30,                       // peak opacity of the ball's anchor shadow on the floor pool (it was 0.55)
    depth: 0.10,                        // how much the picture grows when the ball zooms in (0 = never, 1 = scales with the ball). Small: it is a distant backdrop.
    top: 0.234, bottom: 0.80,           // rows kept on screen on wide screens (glow top .. just below the pool)
    topRow: 'linear-gradient(to right,rgb(181,186,156),rgb(181,186,156),rgb(181,186,156),rgb(179,183,156),rgb(179,183,156),rgb(181,186,156),rgb(181,186,156),rgb(179,183,156),rgb(179,183,156),rgb(178,182,155),rgb(179,183,156),rgb(181,186,156),rgb(182,187,157))'    // the picture's top row, used to extend the sky upward on tall screens with no seam
  },

  playingRing: false,              // the original design's pulsing amber outline round the playing tile; off because it read as a glowing border
  logoStyle: 'opal',               // the slabs the logo is etched into: 'opal' (milky, with colour flashes) or 'agate' (the original sage stone)
  feed: 'data/reels.json',         // written by the feed script on the server (kept outside the deploy tree)
  dataBase: 'data/',               // covers live at data/covers/<id>.jpg
  // Until the Instagram feed is connected, fall back to the prototype's 130 placeholder reels so the page still works.
  // Flip to false once reels.json is live: then a missing/broken feed shows nothing instead of fake tiles.
  placeholderFallback: false,
  // Disco-mode music. null = the built-in synthesized placeholder loop. To use the real loop, put the file next to this
  // page and set e.g. 'disco-loop.mp3' (a seamless 8/16-bar loop; WAV or MP3).
  discoLoop: null
};
</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="./disco.js"></script>
</body>
</html>
